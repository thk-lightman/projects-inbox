[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vault-corpus"
version = "0.1.0"
description = "Build-time pipeline that mirrors a Korean Obsidian vault into an English, chunked, vector-indexed corpus with topic-cluster MOCs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "mori" }]
license = { text = "MIT" }
dependencies = [
    "openai>=1.40.0",
    "sqlite-vss>=0.1.2",
    "scikit-learn>=1.4.0",
    "hdbscan>=0.8.33",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
vault-corpus = "vault_corpus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
