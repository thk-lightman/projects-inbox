services:
  app:
    build: .
    image: util-autoresearch:latest
    volumes:
      - "${VAULT_ROOT:-/Users/mori/Obsidian/Obsidian_Master_v2}:/vault"
      - "${HOME}/.cache/autoresearch:/cache"
    environment:
      - VAULT_ROOT=/vault
      - OPENALEX_EMAIL=${OPENALEX_EMAIL:-}
      # Vault-relative path overrides; unset → script defaults (see .env.example).
      - AR_PAPER_WATCHLIST_LABS_REL=${AR_PAPER_WATCHLIST_LABS_REL:-}
      - AR_PAPER_WATCHLIST_JOURNALS_REL=${AR_PAPER_WATCHLIST_JOURNALS_REL:-}
      - AR_PAPER_INBOX_REL=${AR_PAPER_INBOX_REL:-}
      # Zotero push at collection time (best-effort; unset → skipped).
      - ZOTERO_API_KEY=${ZOTERO_API_KEY:-}
      - ZOTERO_USER_ID=${ZOTERO_USER_ID:-}
      - ZOTERO_COLLECTION=${ZOTERO_COLLECTION:-}
    command:
      - --dedup-db
      - /cache/dedup.sqlite

  blog:
    build: .
    image: util-autoresearch:latest
    entrypoint: ["python3", "fetch_blog.py"]
    volumes:
      - "${VAULT_ROOT:-/Users/mori/Obsidian/Obsidian_Master_v2}:/vault"
      - "${HOME}/.cache/autoresearch:/cache"
    environment:
      - VAULT_ROOT=/vault
      # Vault-relative path overrides; unset → script defaults (see .env.example).
      - AR_BLOG_WATCHLIST_REL=${AR_BLOG_WATCHLIST_REL:-}
      - AR_BLOG_SCRAP_REL=${AR_BLOG_SCRAP_REL:-}
    command:
      - --dedup-db
      - /cache/dedup.sqlite

  test:
    build: .
    image: util-autoresearch:latest
    entrypoint: ["python3", "-m", "pytest"]
    command: ["tests/", "-v"]

  zotero:
    build: .
    image: util-autoresearch:latest
    entrypoint: ["python3", "zotero_save.py"]
    volumes:
      - "${VAULT_ROOT:-/Users/mori/Obsidian/Obsidian_Master_v2}:/vault"
    environment:
      - VAULT_ROOT=/vault
      - ZOTERO_API_KEY=${ZOTERO_API_KEY:-}
      - ZOTERO_USER_ID=${ZOTERO_USER_ID:-}
      - ZOTERO_COLLECTION=${ZOTERO_COLLECTION:-}
      - OPENALEX_EMAIL=${OPENALEX_EMAIL:-}  # Unpaywall contact for OA PDF lookup
