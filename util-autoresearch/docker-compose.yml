services:
  app:
    build: .
    image: util-autoresearch:latest
    volumes:
      - "${VAULT_ROOT:-/Users/mori/Obsidian/Obsidian_Master_v2}:/vault"
      - "${HOME}/.cache/autoresearch:/cache"
    environment:
      - VAULT_ROOT=/vault
      - OPENALEX_EMAIL=${OPENALEX_EMAIL:-}
    command:
      - --watchlist-labs
      - /vault/01 Command Center/prod-autoresearch/docs-watchlist-labs.md
      - --watchlist-journals
      - /vault/01 Command Center/prod-autoresearch/docs-watchlist-journals.md
      - --inbox-dir
      - /vault/00 Get Things Done/03Inbox/auto
      - --dedup-db
      - /cache/dedup.sqlite

  test:
    build: .
    image: util-autoresearch:latest
    entrypoint: ["python3", "-m", "pytest"]
    command: ["tests/", "-v"]

  zotero:
    build: .
    image: util-autoresearch:latest
    entrypoint: ["python3", "zotero_save.py"]
    volumes:
      - "${VAULT_ROOT:-/Users/mori/Obsidian/Obsidian_Master_v2}:/vault"
    environment:
      - VAULT_ROOT=/vault
      - ZOTERO_API_KEY=${ZOTERO_API_KEY:-}
      - ZOTERO_USER_ID=${ZOTERO_USER_ID:-}
      - ZOTERO_COLLECTION=${ZOTERO_COLLECTION:-}
